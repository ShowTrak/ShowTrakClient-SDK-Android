name: Publish Android SDK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish, for example 1.0.1
        required: true
        type: string
      dry_run:
        description: Build and publish to Maven Local only
        required: true
        default: true
        type: boolean
      targets:
        description: >-
          Where to publish. Use a single target to retry one destination
          without re-attempting a release that already went out.
        required: true
        default: both
        type: choice
        options:
          - both
          - central
          - packages
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
      ORG_GRADLE_PROJECT_gprUser: ${{ github.actor }}
      ORG_GRADLE_PROJECT_gprToken: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          # A tag push is always a full release; a manual run may target one
          # destination, which is how a half-failed release gets finished.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            DRY_RUN="false"
            TARGETS="both"
          else
            VERSION="${{ github.event.inputs.version }}"
            DRY_RUN="${{ github.event.inputs.dry_run }}"
            TARGETS="${{ github.event.inputs.targets }}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Invalid version: $VERSION" >&2
            exit 1
          fi

          case "$TARGETS" in
            both) CENTRAL="true"; PACKAGES="true" ;;
            central) CENTRAL="true"; PACKAGES="false" ;;
            packages) CENTRAL="false"; PACKAGES="true" ;;
            *) echo "Invalid targets: $TARGETS" >&2; exit 1 ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "central=$CENTRAL" >> "$GITHUB_OUTPUT"
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"

      - name: Validate release build
        run: >-
          ./gradlew
          :showtrak-sdk:assembleRelease
          :showtrak-sdk:publishToMavenLocal
          -PVERSION_NAME=${{ steps.version.outputs.version }}
          --stacktrace

      - name: Publish to Maven Central
        if: steps.version.outputs.dry_run != 'true' && steps.version.outputs.central == 'true'
        run: >-
          ./gradlew
          publishAndReleaseToMavenCentral
          -PVERSION_NAME=${{ steps.version.outputs.version }}
          --stacktrace

      - name: Publish to GitHub Packages
        if: steps.version.outputs.dry_run != 'true' && steps.version.outputs.packages == 'true'
        run: >-
          ./gradlew
          :showtrak-sdk:publishMavenPublicationToGitHubPackagesRepository
          -PVERSION_NAME=${{ steps.version.outputs.version }}
          --stacktrace
      # publishAndReleaseToMavenCentral only hands the bundle to the Sonatype
      # Central Portal and returns; validation, publishing and the sync to
      # repo1 all happen afterwards. Without this gate the job goes green while
      # the artifact is still unresolvable — or never appears at all, because a
      # deployment that fails validation does so silently, long after the run.
      - name: Wait for Maven Central
        if: steps.version.outputs.dry_run != 'true' && steps.version.outputs.central == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TIMEOUT_SECONDS: '2700'
        run: |
          GROUP="$(sed -n 's/^GROUP=//p' gradle.properties)"
          ARTIFACT="$(sed -n 's/^POM_ARTIFACT_ID=//p' gradle.properties)"
          BASE="https://repo1.maven.org/maven2/${GROUP//.//}/${ARTIFACT}/${VERSION}/${ARTIFACT}-${VERSION}"

          echo "Waiting for ${GROUP}:${ARTIFACT}:${VERSION} to resolve from Maven Central"
          until curl -sfI "${BASE}.pom" >/dev/null && curl -sfI "${BASE}.aar" >/dev/null; do
            if [ "$SECONDS" -ge "$TIMEOUT_SECONDS" ]; then
              echo "::error::${VERSION} was accepted by the Central Portal but did not reach repo1.maven.org within $((TIMEOUT_SECONDS / 60)) minutes. Check its deployment state at https://central.sonatype.com/publishing/deployments — a failed validation never syncs."
              exit 1
            fi
            echo "  not yet (${SECONDS}s elapsed)"
            sleep 30
          done
          echo "${VERSION} is live on Maven Central after ${SECONDS}s"
